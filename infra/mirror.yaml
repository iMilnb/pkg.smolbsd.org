# pkg.smolbsd.org — S3 website mirror + CloudFront + sync-host IAM role
#
# Deploy (from a machine with deploy rights, e.g. this laptop):
#   1. Request an ACM certificate for pkg.smolbsd.org IN us-east-1
#      (DNS validation: add the _acm-validation CNAME at the current
#      smolbsd.org DNS provider). CloudFront only accepts us-east-1 certs.
#   2. aws cloudformation deploy --region eu-west-1 --template-file infra/mirror.yaml \
#        --stack-name pkg-smolbsd-org --capabilities CAPABILITY_NAMED_IAM \
#        --parameter-overrides AcmCertificateArn=arn:aws:acm:us-east-1:<ACCOUNT_ID>:certificate:<CERT_ID>
#   3. Attach the sync role to the sync host instance (one-off):
#        aws ec2 associate-iam-instance-profile \
#          --instance-id <SYNC_HOST_INSTANCE_ID> \
#          --iam-instance-profile Name=Output "InstanceProfileName"
#   4. At the smolbsd.org DNS provider add ONE record:
#        CNAME pkg  ->  <DomainName output>
#      (IPV6Enabled makes that hostname answer both A and AAAA; the legacy
#      "dualstack." prefix is no longer needed/deprecated for new distros)
#
# Sync (crontab on the sync host; bin/sync-cron wraps sync.py: lock + log
# rotation + manifest freshness, see header of bin/sync-cron). NOTE:
# cron runs in the SERVER timezone (host clock is UTC):
#   17 5 * * *  cd $HOME/src/pkg.smolbsd.org && ./bin/sync-cron sets
#   23 5 * * 0  cd $HOME/src/pkg.smolbsd.org && ./bin/sync-cron packages
# Manifest freshness: the packages job curls manifest/needed-<arch>.txt from
# GitHub main at run time (sync-cron validates each download, keeps its
# last-good copy in ~/.pkg-smolbsd-manifest on failure and flags the run
# DEGRADED). A merged manifest-regen PR is therefore live on the very next
# sync WITHOUT git pull on the sync host; git pull is only needed for CODE
# changes.
# Direct invocation (manual, no wrapper): ./bin/sync.py sets --bucket pkg.smolbsd.org --no-cache
# (NOTE: --bucket et al. are SUBCOMMAND-level flags: `sync.py sets --bucket ...`, never
#  `sync.py --bucket ... sets` — argparse rejects the latter with exit 2.)
# If cdn.netbsd.org times out, point sync.py at another NetBSD mirror root:
#   --source https://<mirror>  |  PKG_SMOLBSD_SOURCE env  |  repo `source` file
# The root must carry BOTH pub/pkgsrc/packages/NetBSD and pub/NetBSD-daily
# (https://www.netbsd.org/mirrors/). Verified 2026-11: ftp.netbsd.org serves
# pkgsrc packages but NOT NetBSD-daily; nycdn.netbsd.org (sets default)
# serves both trees. Interrupted runs resume: uploaded files are skipped.
# Extra packages on top of the smolBSD service lists: addpkgs.txt (one bare
# pkgsrc name per line, # comments). A push touching addpkgs.txt triggers
# manifest-refresh immediately (besides Monday/manual): manifests regen with
# the extras, the gate requires every addpkg in the x86_64 manifest
# (aarch64-only gap = warning), and a regen PR opens; merge = live next
# packages sync. Local regen (same as CI):
#   python3 bin/needs.py ../smolBSD --addpkgs addpkgs.txt > names.txt
#   python3 bin/closure.py --list names.txt --arch x86_64 --out manifest/needed-x86_64.txt
#   python3 bin/closure.py --list names.txt --arch aarch64 --out manifest/needed-aarch64.txt
# After every manifest regeneration, audit it independently:
#   python3 bin/verify_deps.py --manifest manifest/needed-x86_64.txt --arch x86_64
#   python3 bin/verify_deps.py --manifest manifest/needed-aarch64.txt --arch aarch64
# (exit 0 = every mirrored package's DEPENDS resolves inside the mirror)
#
# Release switch (e.g. 11.0 -> 11.1), when the time comes:
#   1. echo 11.1 > release; regenerate + audit manifests (commands above)
#   2. run both syncs: new release is mirrored, then the old release's
#      whole subtree (packages AND netbsd-* sets) is auto-pruned.
#      Refused unless the new release has actually landed; --no-cleanup
#      keeps the old release. Preview with --dry-run --version 11.1.
#      No stack change needed: cache patterns are release-agnostic.
#
# Cache design (no invalidations needed): default behavior is UNCACHED
# (listings, stubs, root, summaries, daily sets always fresh); the one
# cache behavior matches immutable versioned .tgz names (CachingOptimized
# 24h) - a release switch or prune is therefore visible immediately.

Parameters:
  BucketName:
    Type: String
    Default: pkg.smolbsd.org
  DomainName:
    Type: String
    Default: pkg.smolbsd.org
  MirrorVersion:
    Type: String
    Default: "11.0"
    Description: >-
      Tagged on the distribution as TrackedRelease for console visibility;
      the repo `release` file is the real knob the sync reads.
  AcmCertificateArn:
    Type: String
    Description: ACM certificate (us-east-1) for the CloudFront alias

Resources:

  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      WebsiteConfiguration:
        IndexDocument: index.html        # generated per-directory by sync.py
      # versioning keeps yesterday's sets/summaries after an overwrite or a
      # bad manifest; old versions expire after 30 days
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            ExpiredObjectDeleteMarker: true   # tidy markers left by prune

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadMirror
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource:
              - !Sub "arn:aws:s3:::${BucketName}/pub/*"
              - !Sub "arn:aws:s3:::${BucketName}/pub"   # slash-less top stub

  # CloudFront: origin is the S3 *website* endpoint (required so generated
  # index.html and x-amz-website-redirect-location stubs are honoured)
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - Key: TrackedRelease
          Value: !Ref MirrorVersion       # visible in console; repo `release` file is the real knob
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100       # US + Europe; switch to PriceClass_All if needed
        Aliases: [!Ref DomainName]
        DefaultRootObject: pub/index.html   # browsable root /
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
        Origins:
          - Id: s3website
            DomainName: !Sub "${BucketName}.s3-website-${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only   # website endpoint has no valid
              # TLS cert for dotted bucket names (multi-label wildcard limit);
              # viewers still get HTTPS via ACM, origin objects are public-read
              # and uploads are always SigV4-signed
        DefaultCacheBehavior:
          TargetOriginId: s3website
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          # Default UNCACHED: pages, stubs, root and summaries are always
          # fresh. Path patterns match the REQUEST path (/pub/), and the
          # website endpoint resolves index.html behind CloudFront, so
          # no-cache behaviors on listings are impossible - invert instead:
          # only immutable .tgz files are cached (single behavior below).
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # CachingDisabled
        CacheBehaviors:
          # the only cacheable objects: versioned, immutable package files
          - PathPattern: "/pub/pkgsrc/packages/NetBSD/*/*/All/*.tgz"
            TargetOriginId: s3website
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized

  # scoped to the bucket only; assumed by the sync host
  SyncRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pkg-smolbsd-sync
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: mirror-write
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListMirror
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${BucketName}"
                Condition:
                  StringLike: { "s3:prefix": ["pub", "pub/*"] }
              - Sid: WriteMirror
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub "arn:aws:s3:::${BucketName}/pub/*"
                  - !Sub "arn:aws:s3:::${BucketName}/pub"  # top redirect stub

  SyncInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: pkg-smolbsd-sync
      Roles: [!Ref SyncRole]

Outputs:
  DomainName:
    Description: "CNAME pkg.smolbsd.org -> this value (answers A and AAAA)"
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  WebsiteURL:
    Value: !GetAtt Bucket.WebsiteURL
  RoleArn:
    Value: !GetAtt SyncRole.Arn
  InstanceProfileName:
    Value: !Ref SyncInstanceProfile
