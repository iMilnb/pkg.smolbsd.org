# GitHub-side automation for pkg.smolbsd.org.
#
# 1. mirror-watch      daily 07:00 UTC — heartbeat: sync.py rewrites
#                      pub/heartbeat.txt on EVERY successful sync, so a
#                      fresh Last-Modified proves the whole chain cron ->
#                      sync -> S3 -> CloudFront is alive even when the run
#                      uploads nothing. Stale > 26 h = failed workflow
#                      = email to the repo owner (GitHub scheduled-failure
#                      mail).
# 2. manifest-check    every PR/push touching manifests or tooling — hard gate:
#                      verify_deps.py must resolve all 600+ DEPENDS edges.
# 3. manifest-refresh  Monday 06:00 UTC + manual + on addpkgs.txt pushes —
#                      regenerate manifests from live smolBSD + live
#                      pkg_summary (plus addpkgs.txt extras); commits any
#                      drift straight to main (the in-job gates are the
#                      review); the
#                      mirror picks it up on the next packages sync.

name: mirror

on:
  schedule:
    - cron: '0 7 * * *'   # heartbeat, daily (UTC!)
    - cron: '0 6 * * 1'   # manifest refresh, Monday (UTC!)
  workflow_dispatch: {}
  pull_request:
    paths: ['manifest/**', 'bin/needs.py', 'bin/closure.py', 'bin/verify_deps.py', 'release']
  push:
    branches: [main]
    paths: ['manifest/**', 'addpkgs.txt', 'bin/needs.py', 'bin/closure.py', 'bin/verify_deps.py', 'release']

permissions:
  contents: read

jobs:
  mirror-watch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: heartbeat check
        run: |
          python3 - <<'EOF'
          import datetime, email.utils, sys, urllib.request
          # heartbeat.txt is rewritten by EVERY sync (sync.py); until it
          # exists (first sync after deploy) fall back to the index page,
          # which only moves when listings change
          urls = ["https://pkg.smolbsd.org/pub/heartbeat.txt",
                  "https://pkg.smolbsd.org/pub/index.html"]
          code, lm = 0, None
          for url in urls:
              req = urllib.request.Request(
                  url, method="HEAD",
                  headers={"User-Agent": "pkg-smolbsd-watch"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      code, lm = r.status, r.headers.get("Last-Modified")
              except urllib.error.HTTPError as err:
                  code = err.code
                  if err.code == 404:
                      print(f"HTTP 404 {url}, falling back")
                      continue
                  break
              if code == 200 and lm:
                  print(f"heartbeat source: {url}")
                  break
          print(f"HTTP {code}, Last-Modified: {lm}")
          if code != 200 or not lm:
              sys.exit(f"heartbeat object not served (HTTP {code})")
          age = datetime.datetime.now(datetime.timezone.utc) \
              - email.utils.parsedate_to_datetime(lm)
          print(f"heartbeat age: {age}")
          if age > datetime.timedelta(hours=26):
              sys.exit(f"MIRROR HEARTBEAT STALE ({age}) - sync cron did not "
                       "run or every run failed; check sync host log")
          EOF

  manifest-check:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: verify committed manifests (audit gate)
        run: |
          for arch in x86_64 aarch64; do
              python3 bin/verify_deps.py --manifest "manifest/needed-$arch.txt" --arch "$arch"
          done

  manifest-refresh:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1') || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: decide whether to regen
        run: |
          # pushes are gated on git itself, not the webhook payload
          # (head_commit.added/modified can be null in the job context)
          case "${{ github.event_name }}" in
              schedule|workflow_dispatch)
                  echo PROCEED=true >> "$GITHUB_ENV"; exit ;;
          esac
          if git show -m --name-only --pretty=format: HEAD | grep -qx 'addpkgs.txt'; then
              echo "push touches addpkgs.txt - regenerating"
              echo PROCEED=true >> "$GITHUB_ENV"
          else
              echo "push does not touch addpkgs.txt - nothing to regen"
          fi
      - uses: actions/setup-python@v5
        if: env.PROCEED == 'true'
        with: { python-version: '3.12' }
      - name: clone smolBSD (package-list source of truth)
        if: env.PROCEED == 'true'
        uses: actions/checkout@v4
        with:
          repository: NetBSDfr/smolBSD
          path: smolBSD-src
          ref: main
      - name: regenerate manifests from live tree
        if: env.PROCEED == 'true'
        run: |
          rel=$(cat release)
          python3 bin/needs.py smolBSD-src --addpkgs addpkgs.txt > names.txt
          for arch in x86_64 aarch64; do
              python3 bin/closure.py --list names.txt --arch "$arch" \
                  --version "$rel" --out "manifest/needed-$arch.txt"
              rc=$?
              # exit 3 = unresolved seed names (known upstream smolBSD bugs,
              # listed in README/plan) - tolerable; anything else is fatal.
              case "$rc" in 0|3) ;; *) exit "$rc" ;; esac
              test -s "manifest/needed-$arch.txt"
          done
      - name: addpkgs resolution gate
        if: env.PROCEED == 'true'
        run: |
          # every package explicitly requested in addpkgs.txt must land in
          # the x86_64 manifest - a typo or retired name stops the run here
          # instead of being silently dropped by closure.py's exit 3
          # tolerance; a missing aarch64 build only warns (arch-specific
          # packages exist upstream)
          grep -v '^#' addpkgs.txt | awk 'NF {print $1}' > addpkgs.names \
              || true
          missing=""
          while read -r n; do
              [ -n "$n" ] || continue
              awk -F'\t' -v n="$n" 'index($1, n "-") == 1 { found=1 } END { exit !found }' \
                  manifest/needed-x86_64.txt || missing="$missing $n"
          done < addpkgs.names
          if [ -n "$missing" ]; then
              echo "addpkgs.txt names not in the x86_64 manifest:$missing"
              exit 1
          fi
          while read -r n; do
              [ -n "$n" ] || continue
              awk -F'\t' -v n="$n" 'index($1, n "-") == 1 { found=1 } END { exit !found }' \
                  manifest/needed-aarch64.txt \
                  || echo "::warning::addpkg $n has no aarch64 build - not mirrored"
          done < addpkgs.names
      - name: verify_deps gate
        if: env.PROCEED == 'true'
        run: |
          for arch in x86_64 aarch64; do
              python3 bin/verify_deps.py --manifest "manifest/needed-$arch.txt" --arch "$arch"
          done
      - name: commit drift straight to main
        if: env.PROCEED == 'true'
        run: |
          # no review dance: the manifest is a generated package list and
          # both gates above already vetted it; a failed run leaves the
          # tree untouched, a green run's push IS the reviewed artifact
          if git diff --quiet -- manifest/; then
              echo "no drift, nothing to do"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest/
          git commit -m "manifest: regen against live tree ($(date -u +%F))"
          git push origin HEAD:refs/heads/main
